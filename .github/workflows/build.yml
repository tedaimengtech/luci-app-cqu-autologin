name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"

permissions:
  contents: read

concurrency:
  group: openwrt-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      OPENWRT_RELEASE: 24.10.4
      OPENWRT_TARGET: x86/64
      # Bump to rebuild the SDK and refresh all feeds.
      SDK_CACHE_VERSION: 2

    steps:
      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          path: package-source

      - name: Generate time-based version
        id: version
        run: |
          timestamp="$(TZ=Asia/Shanghai date +'%Y.%m.%d.%H%M%S')"
          version="${timestamp}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync unzip \
            zlib1g-dev file wget zstd

      - name: Restore prepared OpenWrt SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt-sdk
          key: openwrt-sdk-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ env.OPENWRT_RELEASE }}-${{ env.OPENWRT_TARGET }}-v${{ env.SDK_CACHE_VERSION }}

      - name: Download OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}"
          sdk_file="$(wget -qO- "${base_url}/" \
            | grep -oE 'openwrt-sdk-[^" ]+\.tar\.zst' \
            | head -n1)"
          test -n "$sdk_file"
          wget -q --show-progress "${base_url}/${sdk_file}"
          mkdir openwrt-sdk
          tar --zstd -xf "$sdk_file" -C openwrt-sdk --strip-components=1

      - name: Prepare LuCI feed
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Prepare LuCI host tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: openwrt-sdk
        run: |
          printf '%s\n' \
            'CONFIG_ALL=n' \
            'CONFIG_ALL_NONSHARED=n' \
            'CONFIG_ALL_KMODS=n' > .config
          make defconfig
          # Build host tools only, never the target-side LuCI runtime.
          make package/lua/host/compile -j"$(nproc)" V=s
          make package/luci-base/host/compile -j"$(nproc)" V=s
          test -x staging_dir/hostpkg/bin/jsmin

      - name: Save prepared OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Install current package source
        working-directory: openwrt-sdk
        run: |
          cp -a ../package-source package/luci-app-cqu-autologin
          rm -rf package/luci-app-cqu-autologin/.git package/luci-app-cqu-autologin/.github

      - name: Configure package
        working-directory: openwrt-sdk
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          sed -i "/^LUCI_TITLE:=/i PKG_VERSION:=${PACKAGE_VERSION}\nPKG_RELEASE:=1" package/luci-app-cqu-autologin/Makefile
          printf '%s\n' \
            'CONFIG_ALL=n' \
            'CONFIG_ALL_NONSHARED=n' \
            'CONFIG_ALL_KMODS=n' \
            'CONFIG_PACKAGE_luci-app-cqu-autologin=m' > .config
          make defconfig

      - name: Build only luci-app-cqu-autologin
        working-directory: openwrt-sdk
        run: make package/luci-app-cqu-autologin/compile NO_DEPS=1 -j"$(nproc)" V=s

      - name: Collect package
        run: |
          mkdir -p artifacts
          find openwrt-sdk/bin/packages -type f \
            \( -name 'luci-app-cqu-autologin_*.ipk' -o -name 'luci-app-cqu-autologin-*.apk' \) \
            -exec cp -v {} artifacts/ \;
          test -n "$(find artifacts -type f -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cqu-autologin-${{ steps.version.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish time-based release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
