name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"

permissions:
  contents: read

concurrency:
  group: openwrt-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      OPENWRT_RELEASE: 24.10.4
      OPENWRT_TARGET: x86/64
      # Bump to rebuild the SDK and refresh all feeds.
      SDK_CACHE_VERSION: 3

    steps:
      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          path: package-source

      - name: Ensure host dependencies
        run: |
          packages=(build-essential flex bison gawk gettext git libncurses-dev
                    libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd)
          missing=()
          for package in "${packages[@]}"; do
            if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != 'install ok installed' ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Restore prepared OpenWrt SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt-sdk
          key: openwrt-sdk-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ env.OPENWRT_RELEASE }}-${{ env.OPENWRT_TARGET }}-v${{ env.SDK_CACHE_VERSION }}

      - name: Prepare SDK and feeds on cache miss
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}"
          sdk_file="$(wget -qO- "${base_url}/" \
            | grep -oE 'openwrt-sdk-[^" ]+\.tar\.zst' \
            | head -n1)"
          test -n "$sdk_file"
          wget -q --show-progress "${base_url}/${sdk_file}"
          mkdir openwrt-sdk
          tar --zstd -xf "$sdk_file" -C openwrt-sdk --strip-components=1

          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Save prepared OpenWrt SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Package plugin and collect artifact
        id: version
        run: |
          timestamp="$(TZ=Asia/Shanghai date +'%Y.%m.%d.%H%M%S')"
          version="${timestamp}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          # Copy only package inputs; never reuse old project sources or output.
          package_dir=openwrt-sdk/package/luci-app-cqu-autologin
          mkdir -p "$package_dir"
          cp package-source/Makefile "$package_dir/"
          cp -a package-source/htdocs package-source/root "$package_dir/"
          sed -i "/^LUCI_TITLE:=/i PKG_VERSION:=${version}\nPKG_RELEASE:=1" "$package_dir/Makefile"

          cd openwrt-sdk
          printf '%s\n' \
            'CONFIG_ALL=n' \
            'CONFIG_ALL_NONSHARED=n' \
            'CONFIG_ALL_KMODS=n' \
            'CONFIG_LUCI_JSMIN=n' \
            'CONFIG_LUCI_SRCDIET=n' \
            'CONFIG_LUCI_CSSTIDY=n' \
            'CONFIG_PACKAGE_luci-app-cqu-autologin=m' > .config
          make defconfig
          # Pure scripts/assets: no target dependencies or minifier host builds.
          make package/luci-app-cqu-autologin/compile \
            NO_DEPS=1 LUCI_MINIFY_JS=0 LUCI_MINIFY_LUA=0 LUCI_MINIFY_CSS=0 \
            -j"$(nproc)" V=s
          cd ..
          mkdir -p artifacts
          find openwrt-sdk/bin/packages -type f \
            \( -name 'luci-app-cqu-autologin_*.ipk' -o -name 'luci-app-cqu-autologin-*.apk' \) \
            -exec cp -v {} artifacts/ \;
          test -n "$(find artifacts -type f -print -quit)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cqu-autologin-${{ steps.version.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish time-based release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
