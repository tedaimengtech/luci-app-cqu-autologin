name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      OPENWRT_RELEASE: 24.10.4
      OPENWRT_TARGET: x86/64

    steps:
      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          path: package-source

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync unzip \
            zlib1g-dev file wget zstd

      - name: Download OpenWrt SDK
        run: |
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}"
          sdk_file="$(wget -qO- "${base_url}/" \
            | grep -oE 'openwrt-sdk-[^" ]+\.tar\.zst' \
            | head -n1)"
          test -n "$sdk_file"
          wget -q --show-progress "${base_url}/${sdk_file}"
          mkdir openwrt-sdk
          tar --zstd -xf "$sdk_file" -C openwrt-sdk --strip-components=1

      - name: Install LuCI feed and package source
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base
          cp -a ../package-source package/luci-app-cqu-autologin
          rm -rf package/luci-app-cqu-autologin/.git package/luci-app-cqu-autologin/.github

      - name: Configure package
        working-directory: openwrt-sdk
        run: |
          echo 'CONFIG_PACKAGE_luci-app-cqu-autologin=m' > .config
          make defconfig

      - name: Build only luci-app-cqu-autologin
        working-directory: openwrt-sdk
        run: make package/luci-app-cqu-autologin/compile -j"$(nproc)" V=s

      - name: Collect package
        run: |
          mkdir -p artifacts
          find openwrt-sdk/bin/packages -type f \
            \( -name 'luci-app-cqu-autologin_*.ipk' -o -name 'luci-app-cqu-autologin-*.apk' \) \
            -exec cp -v {} artifacts/ \;
          test -n "$(find artifacts -type f -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cqu-autologin
          path: artifacts/*
          if-no-files-found: error
